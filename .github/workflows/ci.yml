name: CI

on:
  push:
    branches: ["second"]
  workflow_dispatch:

jobs:
  build_1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build --if-present

  test_2:
    runs-on: ubuntu-latest
    needs: build_1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test --if-present

  deploy_3:
    runs-on: ubuntu-latest
    needs: test_2
    steps:
      - uses: actions/checkout@v4
      - run: echo "Run Deploy App"
