name: Astra CI

on:
  push:
    branches:
      - "main"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "."
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build
        run: |
          python -m compileall .

      - name: Test
        run: |
          mkdir -p astra-test-results && python -m pytest --junitxml=astra-test-results/junit.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astra-test-reports
          path: |
            **/astra-test-results/**/*
            **/surefire-reports/*.xml
            **/test-results/**/*.xml
          if-no-files-found: ignore
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-build
          path: "**/*.py"
          if-no-files-found: ignore
