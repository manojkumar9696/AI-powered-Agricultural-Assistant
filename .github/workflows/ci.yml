name: CI

on:
  push:
    branches: ["second"]
  workflow_dispatch:

jobs:
  build_1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "requirements.txt"
      - run: "python -m pip install --upgrade pip && python -m pip install -r requirements.txt"
      - run: "python -m compileall ."

  test_2:
    needs: build_1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "requirements.txt"
      - run: "python -m pip install --upgrade pip && python -m pip install -r requirements.txt"
      - run: "python -m pytest"

  deploy_3:
    needs: test_2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "requirements.txt"
      - run: "echo \"Deploy App Service (configure credentials/secrets before use)\""
